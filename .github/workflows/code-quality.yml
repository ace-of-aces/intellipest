name: Mago Code Quality Checks

on:
  push:
    paths:
      - "src/**/*.php"
      - "mago.toml"
      - ".github/workflows/code-quality.yml"

jobs:
  mago:
    name: mago
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4
        with:
          composer-options: "--prefer-dist --no-interaction"
      
      - name: Set up Mago
        uses: nhedger/setup-mago@v1

      - name: Mago Lint
        if: success() || failure()
        run: mago lint

      - name: Mago Static Analysis
        if: success() || failure()
        run: mago analyze
