name: Mago Code Quality Checks

on:
  push:
    paths:
      - "src/**/*.php"
      - "mago.toml"
      - ".github/workflows/code-quality.yml"
  pull_request:
    paths:
      - "src/**/*.php"
      - "mago.toml"
      - ".github/workflows/code-quality.yml"
  workflow_dispatch:

jobs:
  mago:
    name: mago
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.4"
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          composer-options: "--prefer-dist --no-interaction"

      - name: Set up Mago
        uses: nhedger/setup-mago@b1b8f89862e133daf595f9ec95c7193c36ccfc14 # v1.0.0

      - name: Mago Lint
        if: success() || failure()
        run: mago lint

      - name: Mago Static Analysis
        if: success() || failure()
        run: mago analyze
