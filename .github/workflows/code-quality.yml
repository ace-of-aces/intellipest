name: Mago Code Quality Checks

on:
  push:
    paths:
      - "src/**/*.php"
      - "mago.toml"
      - ".github/workflows/code-quality.yml"
  pull_request:
    paths:
      - "src/**/*.php"
      - "mago.toml"
      - ".github/workflows/code-quality.yml"
  workflow_dispatch:

jobs:
  mago:
    name: mago
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: "8.4"
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          composer-options: "--prefer-dist --no-interaction"

      - name: Set up Mago
        uses: nhedger/setup-mago@537573a8960ddcf61be52611ef10418b664792ef # v1.0.0

      - name: Mago Lint
        if: success() || failure()
        run: mago lint

      - name: Mago Static Analysis
        if: success() || failure()
        run: mago analyze
